<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Warm sunset sky — pushed brighter so it survives the container's vignette. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdebbf"/>
      <stop offset="35%" stop-color="#f7c98a"/>
      <stop offset="70%" stop-color="#f0997b"/>
      <stop offset="100%" stop-color="#c25770"/>
    </linearGradient>
    <!-- Stone of the mantap -->
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf3dc"/>
      <stop offset="100%" stop-color="#d9c79a"/>
    </linearGradient>
    <linearGradient id="stoneShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d5a5"/>
      <stop offset="100%" stop-color="#a89263"/>
    </linearGradient>
    <!-- Golden drapery -->
    <linearGradient id="drape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fac775"/>
      <stop offset="60%" stop-color="#f0a050"/>
      <stop offset="100%" stop-color="#c97540"/>
    </linearGradient>
    <!-- Soft inner glow -->
    <radialGradient id="innerGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#fff3d4" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#fac775" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fac775" stop-opacity="0"/>
    </radialGradient>
    <!-- Sun glow -->
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e2" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f3e1bb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f3e1bb" stop-opacity="0"/>
    </radialGradient>
    <!-- Marigold flower (reusable) -->
    <radialGradient id="marigold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc965"/>
      <stop offset="60%" stop-color="#f29232"/>
      <stop offset="100%" stop-color="#a4521d"/>
    </radialGradient>
    <!-- Rose flower -->
    <radialGradient id="rose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4a3bd"/>
      <stop offset="100%" stop-color="#993556"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Soft setting sun behind the mantap -->
  <circle cx="400" cy="260" r="180" fill="url(#sun)"/>

  <!-- Distant tree silhouettes for depth -->
  <g fill="#7a4055" opacity="0.55">
    <ellipse cx="80" cy="455" rx="60" ry="35"/>
    <ellipse cx="140" cy="445" rx="45" ry="28"/>
    <ellipse cx="720" cy="450" rx="55" ry="30"/>
    <ellipse cx="660" cy="445" rx="40" ry="25"/>
  </g>

  <!-- Ground / petals strewn floor -->
  <rect x="0" y="475" width="800" height="125" fill="#6a2640"/>
  <g fill="#d4537e" opacity="0.75">
    <circle cx="60" cy="495" r="3"/>
    <circle cx="110" cy="510" r="2.5"/>
    <circle cx="175" cy="500" r="3.5"/>
    <circle cx="230" cy="520" r="2.5"/>
    <circle cx="640" cy="500" r="3"/>
    <circle cx="700" cy="515" r="3.5"/>
    <circle cx="750" cy="505" r="2.5"/>
    <circle cx="350" cy="540" r="3"/>
    <circle cx="420" cy="555" r="2.5"/>
    <circle cx="490" cy="545" r="3"/>
  </g>

  <!-- Soft glow under the mantap canopy -->
  <ellipse cx="400" cy="370" rx="220" ry="140" fill="url(#innerGlow)"/>

  <!-- ===== MANTAP STRUCTURE ===== -->

  <!-- Stepped platform -->
  <rect x="170" y="470" width="460" height="22" fill="url(#stoneShadow)"/>
  <rect x="195" y="452" width="410" height="20" fill="url(#stone)"/>
  <rect x="220" y="436" width="360" height="18" fill="url(#stoneShadow)"/>

  <!-- Back pillars (slightly recessed, partly hidden behind the front ones) -->
  <rect x="330" y="200" width="22" height="238" fill="url(#stoneShadow)" opacity="0.92"/>
  <rect x="448" y="200" width="22" height="238" fill="url(#stoneShadow)" opacity="0.92"/>
  <!-- Back pillar caps -->
  <rect x="324" y="195" width="34" height="10" fill="#c9a050"/>
  <rect x="442" y="195" width="34" height="10" fill="#c9a050"/>

  <!-- Front pillars with subtle column detail -->
  <g>
    <!-- Left pillar -->
    <rect x="240" y="180" width="36" height="258" fill="url(#stone)"/>
    <rect x="240" y="180" width="6" height="258" fill="#c9a050" opacity="0.35"/>
    <rect x="270" y="180" width="6" height="258" fill="#c9a050" opacity="0.3"/>
    <!-- Cap -->
    <rect x="230" y="170" width="56" height="14" fill="#d9b15f"/>
    <rect x="234" y="158" width="48" height="12" fill="#e8c478"/>
    <!-- Base -->
    <rect x="232" y="430" width="52" height="14" fill="#d9b15f"/>

    <!-- Right pillar -->
    <rect x="524" y="180" width="36" height="258" fill="url(#stone)"/>
    <rect x="524" y="180" width="6" height="258" fill="#c9a050" opacity="0.35"/>
    <rect x="554" y="180" width="6" height="258" fill="#c9a050" opacity="0.3"/>
    <!-- Cap -->
    <rect x="514" y="170" width="56" height="14" fill="#d9b15f"/>
    <rect x="518" y="158" width="48" height="12" fill="#e8c478"/>
    <!-- Base -->
    <rect x="516" y="430" width="52" height="14" fill="#d9b15f"/>
  </g>

  <!-- Canopy roof -->
  <rect x="210" y="135" width="380" height="28" fill="url(#stone)"/>
  <rect x="195" y="120" width="410" height="18" fill="#d9b15f"/>
  <rect x="195" y="120" width="410" height="4" fill="#e8c478"/>

  <!-- Roof crown ornament (kalash / finial) -->
  <g transform="translate(400 120)">
    <rect x="-6" y="-12" width="12" height="12" fill="#d9b15f"/>
    <ellipse cx="0" cy="-22" rx="12" ry="8" fill="#d9b15f"/>
    <path d="M -8 -28 Q 0 -52 8 -28 Z" fill="#d9b15f"/>
    <circle cx="0" cy="-55" r="5" fill="#fac775"/>
  </g>

  <!-- ===== DRAPERY ===== -->
  <!-- Left curtain (golden cloth, tied mid-pillar) -->
  <g>
    <path d="M 278 184
             Q 290 240 270 295
             Q 305 305 290 365
             Q 275 395 285 440
             L 245 440
             Q 252 395 248 360
             Q 232 305 265 295
             Q 245 240 250 184 Z"
          fill="url(#drape)"/>
    <!-- Cinch tie -->
    <ellipse cx="263" cy="300" rx="20" ry="6" fill="#a4521d"/>
    <ellipse cx="263" cy="298" rx="20" ry="5" fill="#c97540"/>
  </g>

  <!-- Right curtain -->
  <g>
    <path d="M 522 184
             Q 510 240 530 295
             Q 495 305 510 365
             Q 525 395 515 440
             L 555 440
             Q 548 395 552 360
             Q 568 305 535 295
             Q 555 240 550 184 Z"
          fill="url(#drape)"/>
    <ellipse cx="537" cy="300" rx="20" ry="6" fill="#a4521d"/>
    <ellipse cx="537" cy="298" rx="20" ry="5" fill="#c97540"/>
  </g>

  <!-- ===== MARIGOLD GARLAND ===== -->
  <!-- Hanging swag between front pillars -->
  <path d="M 260 184 Q 400 270 540 184" stroke="#a4521d" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- Marigold flowers along the garland curve -->
  <g>
    <circle cx="260" cy="184" r="8" fill="url(#marigold)"/>
    <circle cx="290" cy="206" r="7" fill="url(#marigold)"/>
    <circle cx="320" cy="224" r="8" fill="url(#marigold)"/>
    <circle cx="350" cy="238" r="7" fill="url(#marigold)"/>
    <circle cx="380" cy="247" r="8" fill="url(#marigold)"/>
    <circle cx="410" cy="250" r="9" fill="url(#marigold)"/>
    <circle cx="440" cy="247" r="8" fill="url(#marigold)"/>
    <circle cx="470" cy="238" r="7" fill="url(#marigold)"/>
    <circle cx="500" cy="224" r="8" fill="url(#marigold)"/>
    <circle cx="525" cy="206" r="7" fill="url(#marigold)"/>
    <circle cx="540" cy="184" r="8" fill="url(#marigold)"/>
  </g>
  <!-- Rose accents in the garland -->
  <g>
    <circle cx="335" cy="231" r="4" fill="url(#rose)"/>
    <circle cx="395" cy="249" r="4.5" fill="url(#rose)"/>
    <circle cx="455" cy="243" r="4" fill="url(#rose)"/>
  </g>
  <!-- Hanging tassels at each end -->
  <g stroke="#a4521d" stroke-width="1" fill="none">
    <line x1="260" y1="192" x2="258" y2="218"/>
    <line x1="540" y1="192" x2="542" y2="218"/>
  </g>
  <circle cx="258" cy="222" r="3.5" fill="url(#marigold)"/>
  <circle cx="542" cy="222" r="3.5" fill="url(#marigold)"/>

  <!-- ===== INNER STAGE DETAIL ===== -->
  <!-- Two ceremonial chairs / seat silhouette inside -->
  <g opacity="0.85">
    <rect x="345" y="370" width="40" height="65" rx="6" fill="#993556"/>
    <rect x="349" y="365" width="32" height="14" rx="3" fill="#d9b15f"/>
    <rect x="415" y="370" width="40" height="65" rx="6" fill="#993556"/>
    <rect x="419" y="365" width="32" height="14" rx="3" fill="#d9b15f"/>
  </g>

  <!-- Floor flower bed at the front of the steps -->
  <g>
    <ellipse cx="400" cy="450" rx="80" ry="6" fill="#a4521d" opacity="0.4"/>
    <circle cx="345" cy="448" r="3.5" fill="url(#marigold)"/>
    <circle cx="365" cy="450" r="3" fill="url(#marigold)"/>
    <circle cx="385" cy="448" r="3.5" fill="url(#rose)"/>
    <circle cx="405" cy="450" r="3" fill="url(#marigold)"/>
    <circle cx="425" cy="448" r="3.5" fill="url(#rose)"/>
    <circle cx="445" cy="450" r="3" fill="url(#marigold)"/>
    <circle cx="460" cy="448" r="3" fill="url(#marigold)"/>
  </g>

</svg>
